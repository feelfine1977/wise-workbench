[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wise-workbench"
version = "0.1.0"
description = "WISE Workbench: guided process improvement on top of the wise library"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.11"
dependencies = [
  "wise-pm>=0.1,<0.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "duckdb>=1.0",
  "pyarrow>=16",
  "pandas>=2.0",
  "numpy>=1.24",
  "structlog>=24",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
analytics = ["wise-analytics"]
xes = ["pm4py>=2.7"]
postgres = ["psycopg[binary]>=3.1"]
docx = ["python-docx>=1.1"]
llm = ["ollama>=0.3"]
dev = ["pytest>=8", "pytest-cov", "hypothesis", "ruff", "mypy", "pandas-stubs", "pre-commit", "types-PyYAML"]

[project.scripts]
wise-workbench = "wise_workbench.cli:main"

[tool.uv.sources]
wise-pm = { path = "../../../wise-lib", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wise_workbench = ["py.typed", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::pytest.PytestUnraisableExceptionWarning",
  "ignore::ResourceWarning",
  "ignore:.*observation window ends.*:UserWarning",
  "ignore::pandas.errors.PerformanceWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108", "B905", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
check_untyped_defs = true
warn_unused_ignores = false
ignore_missing_imports = true
files = ["src/wise_workbench"]
