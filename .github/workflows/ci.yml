name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WISE_PM: git+https://github.com/feelfine1977/wise-pm.git@v0.1.0
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    name: backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            apps/backend/pyproject.toml
            packages/process-knowledge/pyproject.toml
      - name: Install the library, the knowledge package and the backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$WISE_PM"
          python -m pip install -e ../../packages/process-knowledge
          python -m pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Types
        run: mypy
      - name: Tests
        env:
          WISE_LOG_FORMAT: console
          WISE_LOG_LEVEL: WARNING
        run: python -m pytest -q
      - name: Contract drift
        run: |
          wise-workbench openapi --yaml --out /tmp/openapi.yaml
          diff -u ../../packages/api-schema/openapi.yaml /tmp/openapi.yaml

  analytics:
    name: analytics package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/wise-analytics
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/wise-analytics/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$WISE_PM"
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Types
        run: mypy src
      - name: Tests
        run: python -m pytest -q

  knowledge:
    name: knowledge package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/process-knowledge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/process-knowledge/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$WISE_PM"
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      # `@wise/flow` is an optional file: dependency on the sibling checkout `../wise-flow`. It is absent
      # here, so npm leaves a dangling link and the build resolves the stub in `stubs/wise-flow` instead
      # (see apps/frontend/README.md).
      - name: Install
        run: npm ci
      - name: Design tokens
        run: npm run tokens
      - name: Lint
        run: npm run lint
      - name: Types
        run: npx tsc -b
      - name: Unit, contract and accessibility tests
        run: npm test
      - name: Generated types match the contract
        run: |
          npm run generate
          git diff --exit-code -- ../../packages/api-schema/generated
      - name: Build
        run: npm run build:live
