[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wise-knowledge"
version = "0.1.0"
description = "Curated process knowledge packs for WISE Workbench: schemas, loaders, knowledge graph, activity canonicalisation"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.11"
authors = [{ name = "Urszula Jessen" }]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
fuzzy = ["rapidfuzz>=3.0"]
graph = ["networkx>=3.0"]
csv = ["pandas>=2.0"]
wise = ["wise-pm>=0.1,<0.2"]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "rapidfuzz>=3.0",
  "networkx>=3.0",
  "pandas>=2.0",
  "wise-pm>=0.1,<0.2",
]

[project.scripts]
wise-knowledge = "wise_knowledge.cli:main"

[project.entry-points."wise_knowledge.packs"]
p2p = "wise_knowledge.builtin:p2p"
o2c = "wise_knowledge.builtin:o2c"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wise_knowledge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108"]
