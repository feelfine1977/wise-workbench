  # ------------------------------------------------------------- pay stage
  - id: p2p.fm.unpaid_or_late_invoice
    version: 1
    name: {en: Invoice not cleared or cleared late, de: Rechnung nicht oder spät ausgeglichen}
    stage: pay
    signature: no p2p.invoice_clear on an invoice-bearing item, or a long lag p2p.ir -> p2p.invoice_clear
    signature_activities: [p2p.invoice_clear, p2p.ir, p2p.vendor_invoice]
    wise_patterns:
      - {type: presence, activities: [p2p.invoice_clear], params: {m: 1}, layer: closure_completeness, template: p2p_bpic19, also_templates: [p2p_bpic19_v1_1], constraint_ref: c_l1_clear_invoice_present, calibration: calibrated, applicability: "DF1, DF2, 2-way"}
      - {type: lag, a: [p2p.ir, p2p.vendor_invoice], b: [p2p.invoice_clear], params: {delta: 30, width: 60, unit: D, missing_a: skip, missing_b: skip, activation: first, response: first_overall}, layer: timeliness_ageing, template: p2p_bpic19, also_templates: [p2p_bpic19_v1_1], constraint_ref: c_l3_invoice_to_clear_days, calibration: calibrated, applicability: "DF1, DF2, 2-way"}
      - {type: presence, activities: [p2p.invoice_clear], params: {m: 1}, layer: closure_completeness, template: p2p_baseline, constraint_ref: b_closure_clear_present, calibration: uncalibrated}
      - {type: lag, a: [p2p.ir, p2p.vendor_invoice], b: [p2p.invoice_clear], params: {delta: 30, width: 60, unit: D, missing_a: skip, missing_b: censor}, layer: timeliness_ageing, template: p2p_baseline, constraint_ref: b_time_invoice_to_clear, calibration: uncalibrated, note: open invoices are scored by their age (censor) instead of as full violations}
    observed_share:
      - {value: 0.2258, of: invoice-bearing PO items without a clearing, source: bpic2019, date: "2026-09-05", note: includes open items at the window end}
      - {value: 0.8892, of: "cleared items whose invoice-to-clearing lag exceeds 30 days (n = 183,301)", source: bpic2019, date: "2026-09-05", note: "payment terms are not in the log; the 30-day delta of the paper's norm is a target, not the contractual term"}
      - {value: 0.2199, of: cleared items whose invoice-to-clearing lag exceeds 90 days, source: bpic2019, date: "2026-09-05"}
      - {value: 63.6, unit: days, of: median invoice-to-clearing lag (p90 106.4 days), source: bpic2019, date: "2026-09-05"}
    evidence: [bpic2019]
    typical_causes:
      - Long contractual payment terms (60 to 90 days) and payment runs on fixed dates
      - Invoice blocked for a variance or a missing receipt
      - Cash management holds payments at period end
      - Open items at the window end (right-censoring), not late payment
    typical_remedies:
      - Payment terms per vendor as a derived attribute; score days beyond terms instead of a fixed delta
      - Blocked-invoice review cadence; early-payment discounts where cash allows
    evidence_to_check:
      - Payment terms from the vendor master; blocking share on the same items
      - Censoring at the window end; lag distribution per company code
    owner_role: accounts_payable
    kpis: [p2p.kpi.invoice_to_clear_days, p2p.kpi.open_invoice_share]
    sources: [BPI Challenge 2019 measurement 2026-09-05, WISE BPIC 2019 norm c_l1_clear_invoice_present and c_l3_invoice_to_clear_days]
    review_status: draft

  - id: p2p.fm.consignment_cleared_per_item
    version: 1
    name: {en: Consignment item settled through invoice clearing, de: Konsignationsposition über Rechnungsausgleich abgerechnet}
    stage: pay
    signature: p2p.invoice_clear on a consignment item (consignment is settled periodically, not per item)
    signature_activities: [p2p.invoice_clear]
    wise_patterns:
      - {type: exclusion, activities: [p2p.invoice_clear], layer: flow_discipline, template: p2p_bpic19, also_templates: [p2p_bpic19_v1_1], constraint_ref: c_l2_consignment_no_clear_invoice, calibration: calibrated, applicability: Consignment}
      - {type: exclusion, activities: [p2p.invoice_clear], layer: flow_discipline, template: p2p_baseline, constraint_ref: b_flow_consignment_no_clear, calibration: uncalibrated, applicability: consignment}
    observed_share:
      - {value: 0.0, of: "consignment PO items with an invoice clearing (n = 14,498)", source: bpic2019, date: "2026-09-05"}
    evidence: [bpic2019]
    typical_causes:
      - Item category wrongly set to consignment for a normal purchase
      - Vendor invoices consignment withdrawals directly instead of settlement
    typical_remedies:
      - Consignment settlement run (MRKO) as the only settlement path; item category maintenance
    evidence_to_check:
      - Settlement documents in the source system; vendor concentration
    owner_role: accounts_payable
    sources: [BPI Challenge 2019 measurement 2026-09-05, WISE BPIC 2019 norm c_l2_consignment_no_clear_invoice]
    review_status: draft

  # ------------------------------------------------------------- effort and value
  - id: p2p.fm.manual_touch_load
    version: 1
    name: {en: Many manual touches and hand-offs, de: Viele manuelle Bearbeitungen und Übergaben}
    stage: order
    signature: derived attributes manual_touch_count, distinct_human_resources, total_events, manual_share above their thresholds
    signature_activities: []
    wise_patterns:
      - {type: metric, attribute: manual_touch_count, params: {threshold: 4.0, width: 6.0, direction: high}, layer: effort_automation, template: p2p_bpic19, also_templates: [p2p_bpic19_v1_1], constraint_ref: c_l7_manual_touches, calibration: calibrated}
      - {type: metric, attribute: distinct_human_resources, params: {threshold: 2.0, width: 4.0, direction: high}, layer: effort_automation, template: p2p_bpic19, also_templates: [p2p_bpic19_v1_1], constraint_ref: c_l7_distinct_human_resources, calibration: calibrated}
      - {type: metric, attribute: total_events, params: {threshold: 10.0, width: 15.0, direction: high}, layer: effort_automation, template: p2p_bpic19, also_templates: [p2p_bpic19_v1_1], constraint_ref: c_l7_total_events, calibration: calibrated}
      - {type: metric, attribute: manual_share, params: {threshold: 0.5, width: 0.5, direction: high}, layer: effort_automation, template: p2p_bpic19, also_templates: [p2p_bpic19_v1_1], constraint_ref: c_l7_manual_share, calibration: calibrated}
      - {type: metric, attribute: manual_touch_count, params: {threshold: 4.0, width: 6.0, direction: high}, layer: effort_automation, template: p2p_baseline, constraint_ref: b_effort_manual_touches, calibration: uncalibrated, note: needs a resource column; batch users are excluded by the derived attribute's regex}
      - {type: metric, attribute: total_events, params: {threshold: 10.0, width: 15.0, direction: high}, layer: effort_automation, template: p2p_baseline, constraint_ref: b_effort_total_events, calibration: uncalibrated}
    evidence: [bpic2019]
    typical_causes:
      - Exceptions (changes, blocks, cancellations) each add manual steps
      - No electronic vendor integration (confirmations and invoices keyed in)
      - Replicated header events counted as touches on every item
    typical_remedies:
      - Touchless targets per spend area; EDI and e-invoicing with the largest vendors
      - Exception reduction upstream (price and quantity alignment before ordering)
    evidence_to_check:
      - Replication diagnostics before reading touch counts; batch users excluded
      - Which activities carry the manual touches (drivers by constraint and activity)
    owner_role: purchasing
    kpis: [p2p.kpi.touchless_rate]
    sources: [WISE BPIC 2019 norm L7 constraints and derived attributes]
    review_status: draft

  - id: p2p.fm.networth_volatility
    version: 1
    name: {en: Volatile cumulative net worth across postings, de: Schwankender kumulierter Nettowert über die Buchungen}
    stage: invoice
    signature: high coefficient of variation of the cumulative net worth over the item's events (derived attribute networth_cv)
    signature_activities: []
    wise_patterns:
      - {type: metric, attribute: networth_cv, params: {threshold: 0.5, width: 1.0, direction: high}, layer: value_commercial, template: p2p_bpic19, also_templates: [p2p_bpic19_v1_1], constraint_ref: c_l6_networth_volatility, calibration: calibrated, applicability: "DF1, DF2, 2-way"}
    evidence: [bpic2019]
    typical_causes:
      - Price and quantity changes after ordering
      - Partial invoices and memos moving the cumulative value up and down
      - Currency changes
    typical_remedies:
      - Address the underlying changes (price, quantity) and memo handling; the indicator itself is a commercial-risk signal, not a target
    evidence_to_check:
      - Which events move the value; relation to price changes and memos on the same items
    owner_role: finance_controlling
    sources: [WISE BPIC 2019 norm c_l6_networth_volatility]
    review_status: draft

  - id: p2p.fm.delivery_indicator_reopened
    version: 1
    name: {en: Delivery-completed indicator changed repeatedly, de: Endlieferungskennzeichen mehrfach geändert}
    stage: receive
    signature: two or more p2p.po_change_delivery_indicator on the item (set once is normal; twice means the item was reopened)
    signature_activities: [p2p.po_change_delivery_indicator]
    wise_patterns:
      - {type: singularity, activities: [p2p.po_change_delivery_indicator], params: {k: 1, K: 2}, layer: rework_instability, calibration: uncalibrated, note: no template constraint yet; add to the baseline once calibrated}
    observed_share:
      - {value: 0.0118, of: PO items with a delivery-indicator change, source: bpic2019, date: "2026-09-05"}
    evidence: [bpic2019]
    typical_causes:
      - Item closed and reopened when a further delivery arrived
      - Indicator used to close short deliveries and reset for corrections
    typical_remedies:
      - Close items only after the vendor confirms the final quantity; under-delivery tolerance
    evidence_to_check:
      - Receipts between the two indicator changes; vendor concentration
    owner_role: warehouse
    sources: [BPI Challenge 2019 measurement 2026-09-05, SAP MM documentation delivery completed indicator]
    review_status: draft

  # ------------------------------------------------------------- data-quality patterns (readiness checks, never scored expectations)
  - id: p2p.fm.block_release_logging_asymmetry
    version: 1
    name: {en: Payment-block releases without a logged block, de: Zahlsperren-Aufhebungen ohne protokollierte Sperre}
    stage: match
    kind: data_quality
    signature: "p2p.payment_block_remove on the item without a preceding p2p.payment_block_set; BPIC 2019 has 57,136 release events against 124 set events, and 55,812 of the 55,839 items with a release carry no logged block (measured 2026-09-06)"
    signature_activities: [p2p.payment_block_remove, p2p.payment_block_set]
    wise_patterns:
      - {type: precedence, a: [p2p.payment_block_set], b: [p2p.payment_block_remove], params: {k: 0, K: 1, missing_a: violate, missing_b: skip}, layer: exceptions_corrections, calibration: uncalibrated, note: "readiness check, not a scored expectation: the share of releases without a logged block measures how blocks are recorded, not how often invoices are blocked; no template carries it"}
    observed_share:
      - {value: 0.9995, of: "PO items with a payment-block release that have no logged block set (55,812 of 55,839)", source: bpic2019, date: "2026-09-06"}
      - {value: 0.2218, of: "PO items with at least one payment-block release (DF2 24.3 %, DF1 14.7 %, 2-way 0.1 %, consignment 0.0 %)", source: bpic2019, date: "2026-09-06"}
    evidence: [bpic2019]
    typical_causes:
      - Blocks set automatically at invoice posting (price or quantity variance through the tolerance keys) are not written as events; only the manual release is
      - Manual blocks write a change document, automatic ones do not
    typical_remedies:
      - Readiness warning on the asymmetry printed with every block share; read release counts as block counts, never as block reasons
      - Join the blocking reason from the invoice document as a case attribute before any expectation on setting a block
    evidence_to_check:
      - Ratio of release events to set events per purchasing organisation and period
      - Whether the source system writes a change document for automatic blocks
    owner_role: it_process_owner
    kpis: [p2p.kpi.payment_block_rate]
    sources: [BPI Challenge 2019 measurement 2026-09-06 (log primitives), BPI Challenge 2019 HPI report (Set Payment Block almost never logged), cycle 1 review §5 row 9]
    review_status: draft
    notes: Data-quality pattern (R1-24); an expectation on p2p.payment_block_set would measure logging, not behaviour.

  - id: p2p.fm.missing_order_confirmation
    version: 1
    name: {en: Vendor order confirmation not recorded, de: Auftragsbestätigung des Lieferanten nicht erfasst}
    stage: order
    kind: data_quality
    signature: "no p2p.po_confirmation_receive on the item; BPIC 2019 records one on 12.7 % of items, 97 of 1,975 vendors have any, and 37 of the 1,374 invoice-first vendors confirm in more than 70 % of their items (measured 2026-09-06)"
    signature_activities: [p2p.po_confirmation_receive]
    wise_patterns:
      - {type: presence, activities: [p2p.po_confirmation_receive], params: {m: 1}, layer: rework_instability, calibration: uncalibrated, note: "readiness check, not a scored expectation: absence measures whether confirmations are recorded (confirmation control, EDI), not whether the vendor confirmed; reported per vendor and purchasing organisation"}
    observed_share:
      - {value: 0.1274, of: "PO items with a recorded order confirmation (DF2 14.2 %, DF1 0.3 %, consignment 5.1 %, 2-way 0.0 %)", source: bpic2019, date: "2026-09-06"}
      - {value: 37, unit: vendors, of: "invoice-first (DF2) vendors, of 1,374, that confirm in more than 70 % of their items (the RWTH report counted 43)", source: bpic2019, date: "2026-09-06"}
    evidence: [bpic2019]
    typical_causes:
      - Confirmations arrive by e-mail or phone and are not entered on the order
      - Confirmation control not activated for the vendor in the purchasing master data
      - EDI confirmations only for a few vendors
    typical_remedies:
      - Activate confirmation control for the vendors whose delivery dates matter; EDI confirmations for the largest vendors
      - Report the confirmation share as a readiness finding per vendor, never as a shortfall of the vendor
    evidence_to_check:
      - Confirmation share per vendor and purchasing organisation
      - Whether the vendors without confirmations are the same across periods (recording practice) or change (vendor behaviour)
    owner_role: purchasing
    kpis: [p2p.kpi.confirmation_churn]
    sources: [BPI Challenge 2019 measurement 2026-09-06 (log primitives), BPI Challenge 2019 RWTH report (43 of 1,374 DF2 vendors confirm in more than 70 % of items), cycle 1 review §5 row 14]
    review_status: draft
    notes: Data-quality pattern (R1-24); a presence expectation on confirmations would penalise vendors for the buyer's recording practice.
