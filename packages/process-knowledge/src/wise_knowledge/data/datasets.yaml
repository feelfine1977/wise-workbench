# Registry of public event logs used for knowledge packs, presets and evaluation.
# Counts marked approx are from the literature; fill `checked` after download.
# Files are never stored in the repository.
version: 1
licence_default: CC-BY-4.0
datasets:
  - id: bpic2019
    title: BPI Challenge 2019
    doi: 10.4121/uuid:d06aff4b-79f0-45e6-8ec8-e19730c248f1
    pack: p2p
    process: purchase-to-pay
    organisation: multinational coatings company (NL)
    formats: [csv, xes, ocel]
    cases: 251734
    events: 1595923
    activities: 42
    period: 2018 (tail into 2019)
    case_notion: purchase order item
    exposure: cumulative net worth
    slice_keys: [vendor, purchasing organisation, item category, spend area, company]
    pitfalls: [flow types by item category, replicated header events, right-censoring of open items]
    preset: presets/bpic2019.yaml
    reference_norm: ../../examples/bpic19_norm.json   # from the wise-pm repository
    checked:
      date: 2026-09-05
      file: BPI_Challenge_2019.csv
      events: 1595923
      cases: 251734
      activities: 42
      vendors: 1975
      timestamp_range: 1948-01-26 to 2020-09-04 (outliers; bulk 2018 to early 2019)
      item_category_events: {3-way match invoice before GR: 1234708, 3-way match invoice after GR: 319233, consignment: 36084, 2-way match: 5898}
      spend_areas: 20
      companies: 4 (one holds 99.6% of events)
