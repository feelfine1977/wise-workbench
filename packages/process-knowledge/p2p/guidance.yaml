      - text: "Vendor document date earlier for framework agreements"
        where: outside
        check: "ask purchasing"
      - text: "Requisition outside the system"
        where: outside
        check: "ask the requesters"
    usual_actions:
      - text: "No-purchase-order-no-pay policy"
        countermeasure: policy
