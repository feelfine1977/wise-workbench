  - id: p2p.fm.invoice_before_order
    plain_name: {en: "Invoice before the order", de: "Rechnung vor der Bestellung"}
    missed_label: {en: "invoice dated before the order", de: "Rechnung vor der Bestellung datiert"}
    expectation: The order exists before the invoice.
    meaning_when_missed: The invoice was dated or posted before the order item was created.
    why_it_matters: The clearest sign of maverick buying; 1.8 % of BPIC 2019 items with a vendor invoice, 0.0 % by posting.
    how_detected: Order rule comparing order creation with the first invoice evidence (baseline).
    usual_reasons:
      - text: "After-the-fact orders"
        where: log
