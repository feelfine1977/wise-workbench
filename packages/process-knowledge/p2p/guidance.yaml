      - text: "Confirmed date moved"
        where: log
        check: "confirmation changes on late items"
      - text: "Transport and customs"
        where: log
        check: "vendor country and incoterms"
      - text: "Late posting at the dock"
        where: outside
        check: "ask the warehouse"
    usual_actions:
      - text: "Planned lead times aligned per vendor and country"
        countermeasure: master_data
        owner_role: master_data
        effect_area: timeliness_ageing
      - text: "Confirmation control and expediting"
        countermeasure: system_setting
        owner_role: purchasing
        effect_area: timeliness_ageing
      - text: "Dock posting on the day of arrival"
        countermeasure: standard_work
        owner_role: warehouse
