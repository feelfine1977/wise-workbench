  - id: p2p.fm.vendor_debit_memo
    plain_name: {en: "Vendor debit memo", de: "Lastschrift des Lieferanten"}
    missed_label: {en: "vendor debit memo", de: "Lastschrift des Lieferanten"}
    expectation: The vendor does not claim more after the invoice.
    meaning_when_missed: A debit memo on the item, weighted by value in the paper's norm.
    why_it_matters: Money on top of the invoice and a dispute; 2.4 % of BPIC 2019 items.
    how_detected: Debit memo events; value-weighted on high-exposure items.
    usual_reasons:
