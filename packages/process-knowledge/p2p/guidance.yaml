        check: "ask purchasing how short deliveries are closed"
    usual_actions:
      - text: "Close only after the vendor confirms the final quantity; under-delivery tolerance"
        countermeasure: standard_work
        owner_role: purchasing
        effect_area: rework_instability
    what_to_check_first:
      - Receipts between the indicator changes
      - Vendor concentration
    examples:
      - kind: violating
        text: "Closed in May, reopened in June for a late partial delivery."
      - kind: compliant
        text: "Closed once after the last receipt."
    kpis: []
    owner_role: warehouse

  - id: p2p.fm.block_release_logging_asymmetry
    plain_name: {en: "Block releases without a logged block", de: "Sperraufhebungen ohne protokollierte Sperre"}
    missed_label: {en: "blocks not logged", de: "Sperren nicht protokolliert"}
    expectation: "A data-quality expectation, not a process one: every block release has a logged block, so that block counts can be read."
    meaning_when_missed: Releases are logged but the blocks are not; in BPIC 2019 57,136 release events stand against 124 set events, and 55,812 of the 55,839 items with a release (99.95 %) have no logged block. Block shares therefore measure releases, and the blocking reason is not in the log.
    why_it_matters: Reading the release count as a block count is right in size but blind to the reason; any expectation on setting a block measures logging, not behaviour.
    how_detected: A readiness check comparing the frequency of the release activity with its setting activity; the pattern is not a scored expectation.
    usual_reasons:
      - text: "Blocks set automatically at invoice posting are not written as events, only their release is"
        where: log
        check: "ratio of release to set events; releases without a preceding set"
      - text: "Manual blocks logged, automatic ones not"
        where: outside
        check: "ask the source-system owner which block reasons write a change document"
    usual_actions:
      - text: "Readiness warning on the asymmetry printed with every block share"
        countermeasure: measurement
        owner_role: it_process_owner
        effect_area: exceptions_corrections
      - text: "Blocking reason joined from the invoice document as a case attribute"
        countermeasure: measurement
        owner_role: accounts_payable
        effect_area: timeliness_ageing
    what_to_check_first:
      - Ratio of release events to set events
      - Whether the blocking reason can be joined from the source system
    examples:
      - kind: violating
        text: "A log with 57,136 releases and 124 sets; 99.95 % of the items with a release show no block being set."
      - kind: compliant
        text: "Every release preceded by a logged set with a reason."
    kpis: [p2p.kpi.payment_block_rate]
    owner_role: it_process_owner

  - id: p2p.fm.missing_order_confirmation
    plain_name: {en: "Order confirmation not recorded", de: "Auftragsbestätigung nicht erfasst"}
    missed_label: {en: "no confirmation recorded", de: "keine Bestätigung erfasst"}
    expectation: "A data-quality expectation: vendor confirmations are recorded on the item, so that confirmation behaviour can be read."
    meaning_when_missed: No confirmation event on the item; in BPIC 2019 12.7 % of items carry one, 97 of 1,975 vendors have any, and 37 of the 1,374 invoice-first vendors confirm in more than 70 % of their items (the RWTH report counted 43), so absence measures recording practice, not the vendor.
    why_it_matters: Without recorded confirmations neither confirmation churn nor late confirmations can be judged; a presence rule on it would penalise vendors for our recording, which is why it is not a scored expectation.
    how_detected: A presence check on confirmation events, reported as a readiness finding per vendor and purchasing organisation.
    usual_reasons:
      - text: "Confirmations arrive by e-mail and are not entered"
        where: outside
        check: "ask purchasing how confirmations are handled per purchasing organisation"
      - text: "Confirmation control not activated for the vendor"
        where: outside
        check: "ask master data which vendors have confirmation control"
      - text: "EDI confirmations only for some vendors"
        where: log
        check: "confirmation share per vendor"
    usual_actions:
      - text: "Confirmation control activated for the vendors that matter"
        countermeasure: system_setting
        owner_role: purchasing
        effect_area: rework_instability
      - text: "Confirmation share reported as a readiness finding, not as a shortfall"
        countermeasure: measurement
        owner_role: it_process_owner
        effect_area: rework_instability
    what_to_check_first:
      - Confirmation share per vendor and purchasing organisation
      - Whether confirmation control is active
    examples:
      - kind: violating
        text: "A vendor with 3,000 items and no confirmation event; confirmations arrive by e-mail."
      - kind: compliant
        text: "EDI confirmation recorded on every item of the vendor."
    kpis: [p2p.kpi.confirmation_churn]
    owner_role: purchasing
