  - id: p2p.fm.invoice_before_goods_receipt
    plain_name: {en: "Invoice before goods receipt in a GR-based flow", de: "Rechnung vor Wareneingang im WE-bezogenen Fluss"}
    missed_label: {en: "invoice before goods receipt", de: "Rechnung vor Wareneingang"}
    expectation: In GR-based flows the invoice follows the receipt, and soon.
    meaning_when_missed: Invoice evidence before the first receipt, or a long gap after it.
    why_it_matters: The three-way match cannot be completed at posting; 51.7 % of BPIC 2019 GR-based items by the merged rule, 53.6 % by the vendor's invoice date, 0.0 % by posting date.
    how_detected: Order rule and time rule from receipt to invoice on GR-based items; split into vendor date and posting in norm draft v1.1.
    usual_reasons:
      - text: "Vendor invoices at dispatch"
        where: log
        check: "share early by vendor invoice date against share by posting"
      - text: "Late posting at the dock"
        where: log
        check: "posting delay; lags near zero or negative"
      - text: "Wrong item category"
        where: log
        check: "vendors whose GR-based items are mostly invoice-first"
      - text: "Drop shipments and services with a formal receipt later"
        where: outside
        check: "ask the buyer"
    usual_actions:
      - text: "Split the expectation into vendor date and posting"
        countermeasure: measurement
        owner_role: finance_controlling
        effect_area: flow_discipline
      - text: "GR-based verification flag corrected per vendor and material"
        countermeasure: master_data
        owner_role: master_data
        effect_area: flow_discipline
      - text: "Dock posting on the day of arrival; invoices parked until the receipt"
        countermeasure: standard_work
        owner_role: warehouse
        effect_area: flow_discipline
      - text: "Evaluated receipt settlement for stable-price vendors"
        countermeasure: automation
        owner_role: accounts_payable
        effect_area: flow_discipline
    what_to_check_first:
      - Vendor document or posting as the early evidence
      - Posting delay against delivery-note dates
      - Item category on the vendor's other items
    examples:
      - kind: violating
        text: "Vendor invoice ten days before the receipt, posted after it."
      - kind: compliant
        text: "Receipt first, invoice two days later."
    kpis: [p2p.kpi.three_way_match_first_time_rate, p2p.kpi.gr_to_invoice_days]
    owner_role: accounts_payable

  - id: p2p.fm.payment_block
    plain_name: {en: "Invoice blocked for payment", de: "Rechnung zahlungsgesperrt"}
    missed_label: {en: "payment block", de: "Zahlsperre"}
    expectation: Invoices match and pay without a block; in invoice-first flows the block releases right after the receipt.
    meaning_when_missed: A block was set or released on the item; in invoice-first flows a release before or long after the receipt.
    why_it_matters: Blocks delay payment and need manual work; 22.2 % of BPIC 2019 items carry a release (24.3 % of invoice-first items), only 0.05 % a logged set.
    how_detected: Order and time rules around the block release in invoice-first flows; a rule against manual blocks elsewhere (baseline). Automatic blocks are not logged as events, only their release.
    usual_reasons:
      - text: "Invoice posted before the receipt (block by design)"
        where: log
        check: "flow type and receipt status at posting"
      - text: "Price or quantity variance above tolerance"
        where: log
        check: "price and quantity changes on the same items"
      - text: "Receipt missing or on another item"
        where: log
        check: "receipt status and sibling items"
      - text: "Manual block for a dispute or missing approval"
        where: outside
        check: "ask accounts payable for the blocking reasons"
    usual_actions:
      - text: "Tolerance keys reviewed with finance; prices aligned before invoicing"
        countermeasure: system_setting
        owner_role: finance_controlling
        effect_area: value_commercial
      - text: "Release cadence and ownership per blocking reason"
        countermeasure: review
        owner_role: accounts_payable
        effect_area: timeliness_ageing
      - text: "Receipt discipline so that blocks release automatically"
        countermeasure: standard_work
        owner_role: warehouse
        effect_area: flow_discipline
    what_to_check_first:
      - Blocking reason from the source system
      - Receipt-to-release and release-to-clearing lags
      - Flow type (blocks expected or exceptions)
    examples:
      - kind: violating
        text: "Blocked for a price variance, released three weeks after the receipt."
      - kind: compliant
        text: "Released by the run the day after the receipt."
    kpis: [p2p.kpi.payment_block_rate, p2p.kpi.three_way_match_first_time_rate]
    owner_role: accounts_payable

  - id: p2p.fm.goods_receipt_in_two_way
    plain_name: {en: "Receipt on a two-way item", de: "Wareneingang auf Zweiwege-Position"}
