  - id: p2p.fm.missing_invoice
    plain_name: {en: "Invoice missing", de: "Rechnung fehlt"}
    missed_label: {en: "no invoice", de: "keine Rechnung"}
    expectation: Invoice-bearing items show an invoice.
    meaning_when_missed: No invoice evidence on the item.
    why_it_matters: Unrecorded liabilities and unpaid vendors; 10.9 % of BPIC 2019 invoice-bearing items, including open and deleted ones.
    how_detected: Presence of invoice evidence on invoice-bearing items.
    usual_reasons:
      - text: "Still open at the end of the data"
        where: log
        check: "age at the window end"
      - text: "Deleted or delivery not completed"
        where: log
        check: "deletion events, missing receipts"
      - text: "Invoice posted without order reference"
        where: outside
        check: "ask accounts payable for FI invoices of the vendor"
      - text: "Consignment or framework items typed as invoice-bearing"
        where: outside
        check: "ask the buyer"
    usual_actions:
      - text: "Censoring gate before reading"
        countermeasure: measurement
        owner_role: finance_controlling
        effect_area: closure_completeness
      - text: "Mandatory order reference at invoice capture and vendor communication on missing invoices"
        countermeasure: standard_work
        owner_role: accounts_payable
        effect_area: closure_completeness
    what_to_check_first:
