      - text: "Invoice sent twice"
        where: log
        check: "repeat with cancellation; vendor concentration"
      - text: "Cancelled and re-posted"
        where: log
        check: "cancellation between repeats"
      - text: "Freight invoiced separately"
        where: outside
        check: "ask accounts payable"
    usual_actions:
      - text: "Duplicate-invoice check at capture"
        countermeasure: system_setting
        owner_role: accounts_payable
        effect_area: rework_instability
      - text: "One invoice channel per vendor"
        countermeasure: policy
        owner_role: accounts_payable
        effect_area: rework_instability
      - text: "Consolidated invoicing with fragmenting vendors"
        countermeasure: contract
        owner_role: vendor_management
        effect_area: rework_instability
    what_to_check_first:
