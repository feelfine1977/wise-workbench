  - {label: Change Currency, activity: p2p.po_change_currency}
  - {label: Change Final Invoice Indicator, activity: p2p.final_invoice_indicator_change}
  - {label: "SRM: Transaction Completed", activity: p2p.srm_transaction_completed}
  - {label: Change payment term, activity: p2p.po_change_payment_terms}
  - {label: "SRM: Incomplete", activity: p2p.srm_incomplete}
