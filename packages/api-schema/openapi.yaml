                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{jobId}:
    get:
      tags:
      - jobs
      summary: Get Job
      operationId: getJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          title: Jobid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - jobs
      summary: Cancel Job
      operationId: cancelJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          title: Jobid
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{jobId}/events:
    get:
      tags:
      - jobs
      summary: Job Events
      description: 'Server-sent events: `progress` on every change, heartbeat comments while nothing changes, then one terminal `done` event (status done, failed or cancelled) and the stream closes.'
      operationId: jobEvents
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          title: Jobid
      - name: timeout
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 1
          - type: 'null'
          title: Timeout
      responses:
        '200':
          description: text/event-stream
          content:
            application/json:
              schema: {}
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
