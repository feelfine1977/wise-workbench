components:
  schemas:
    AbsentFlowType:
      properties:
        name:
          type: string
          title: Name
        reason:
          type: string
          enum:
          - missing_column
          - matches_nothing
          title: Reason
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
      type: object
      required:
      - name
      - reason
      title: AbsentFlowType
      description: A flow type the rules name that this log has none of, with the reason (R3-15).
    ActionCreate:
      properties:
        title:
          type: string
          title: Title
        runId:
          anyOf:
          - type: string
          - type: 'null'
          title: Runid
        slicing:
          anyOf:
          - type: string
          - type: 'null'
          title: Slicing
        sliceKey:
          anyOf:
          - type: string
          - type: 'null'
          title: Slicekey
        view:
          anyOf:
          - type: string
          - type: 'null'
          title: View
        filter:
