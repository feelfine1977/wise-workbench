        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          title: Runid
      - name: scope
        in: query
        required: false
        schema:
          enum:
          - flow
          - stages
          type: string
          description: the observed flow or the pack's stage model
          default: flow
          title: Scope
        description: the observed flow or the pack's stage model
      - name: detail
        in: query
        required: false
        schema:
          type: number
          maximum: 1.0
          minimum: 0.0
          description: detail level of the map (abstraction)
          default: 0.05
          title: Detail
        description: detail level of the map (abstraction)
      - name: slicing
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Slicing
      - name: sliceKey
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Slicekey
      - name: gateways
        in: query
        required: false
        schema:
          type: boolean
          description: insert exclusive gateways where a task branches or joins
          default: true
          title: Gateways
        description: insert exclusive gateways where a task branches or joins
      - name: bands
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'JSON list of band specs for numeric attributes: [{"attribute": "exposure", "method": "quantile", "q": 4}]'
          title: Bands
        description: 'JSON list of band specs for numeric attributes: [{"attribute": "exposure", "method": "quantile", "q": 4}]'
      - name: filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'URL-safe JSON filter: {"and": [{"kind": "attribute", "field": "…", "in": […]}, …]}; never changes applicability'
          title: Filter
        description: 'URL-safe JSON filter: {"and": [{"kind": "attribute", "field": "…", "in": […]}, …]}; never changes applicability'
      - name: download
        in: query
        required: false
        schema:
          type: boolean
          description: offer the file as an attachment
          default: false
          title: Download
        description: offer the file as an attachment
      responses:
