  /projects/{projectId}/runs/{runId}/whatif:
    post:
      tags:
      - what-if
      summary: Create Whatif
      description: 'Queue a scenario against this run as the frozen baseline. A scenario changes the log (the transform layer: cap a lag, delete an activity, move an event, set an attribute, keep first), the norm (thresholds and applicability, which become a new norm version with its own fingerprint), or both, and is then scored under the baseline''s own parameters. The job''s `resultRef` is the scenario run; its change table is read from `GET /runs/{scenarioId}/whatif`.'
      operationId: createWhatIf
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          title: Runid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatIfCreate'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Content
    get:
      tags:
      - what-if
      summary: Get Whatif
      description: 'The change table of a scenario run against its frozen baseline: per group the two runs'' cases, mean score and priority with the difference of each and the movement in rank, the groups that entered and left, the agreement of the two orders, and the provenance of both numbers.'
      operationId: getWhatIf
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          title: Runid
      - name: slicing
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Slicing
      - name: view
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: View
      - name: minCases
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Mincases
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeTable'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
