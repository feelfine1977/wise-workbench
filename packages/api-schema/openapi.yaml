openapi: 3.1.0
info:
  title: WISE Workbench API
  description: 'WISE Workbench backend: projects, datasets, mappings, case tables, norm versions, runs, backlogs, slice detail, traces, diagnostics, signal distributions, process flow and jobs. Errors are RFC 9457 problem details.'
  version: 0.1.0
paths:
  /system/health:
    get:
      tags:
      - system
      summary: Health
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health
  /system/ready:
    get:
      tags:
      - system
      summary: Ready
      operationId: ready
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ready
  /system/version:
    get:
      tags:
      - system
      summary: Version
      operationId: version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /projects:
    get:
      tags:
      - projects
      summary: List Projects
      operationId: listProjects
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Project'
                type: array
                title: Response Listprojects
    post:
      tags:
      - projects
      summary: Create Project
      operationId: createProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}:
    get:
      tags:
      - projects
      summary: Get Project
      operationId: getProject
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets:
    get:
      tags:
      - datasets
      summary: List Datasets
      operationId: listDatasets
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetVersion'
                title: Response Listdatasets
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - datasets
      summary: Upload Dataset
      description: Multipart upload of CSV, Parquet or XES; returns the ingest job. The dataset id is in resultRef.
      operationId: uploadDataset
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_uploadDataset'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets/presets:
    get:
      tags:
      - datasets
      summary: List Presets
      description: Public logs with a known mapping and norm that can be loaded in one click; `available` says whether the files are on this machine.
      operationId: listPresets
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Preset'
                title: Response Listpresets
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets/presets/{presetId}:
    post:
      tags:
      - datasets
      summary: Load Preset
      description: 'Loads a public log preset: registers the configured file (not copied), builds the case table with the known mapping, imports the norm and scores a run, all in one job. The run id is in resultRef when done; every step reuses what the project already has.'
      operationId: loadPreset
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: presetId
        in: path
        required: true
        schema:
          type: string
          title: Presetid
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Content
  /projects/{projectId}/datasets/{datasetId}:
    get:
      tags:
      - datasets
      summary: Get Dataset
      operationId: getDataset
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          title: Datasetid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersion'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets/{datasetId}/preview:
    get:
      tags:
      - datasets
      summary: Preview Dataset
      operationId: previewDataset
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          title: Datasetid
      - name: rows
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 50
          title: Rows
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets/{datasetId}/mapping-suggestion:
    get:
      tags:
      - datasets
      summary: Suggest Mapping
      description: 'A column mapping guessed from the column names: exact presets for known logs, patterns otherwise.'
      operationId: suggestMapping
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          title: Datasetid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingSuggestion'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets/{datasetId}/mappings:
    get:
      tags:
      - datasets
      summary: List Mappings
      operationId: listMappings
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          title: Datasetid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColumnMappingOut'
                title: Response Listmappings
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - datasets
      summary: Create Mapping
      description: Validates the mapping on a sample and starts the case-table build job. The case table id is in resultRef.
      operationId: createMapping
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          title: Datasetid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnMapping'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Content
  /projects/{projectId}/case-tables:
    get:
      tags:
      - datasets
      summary: List Case Tables
      operationId: listCaseTables
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseTable'
                title: Response Listcasetables
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/case-tables/{caseTableId}:
    get:
      tags:
      - datasets
      summary: Get Case Table
      operationId: getCaseTable
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: path
        required: true
        schema:
          type: string
          title: Casetableid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseTable'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/case-tables/{caseTableId}/mapping:
    get:
      tags:
      - datasets
      summary: Get Case Table Mapping
      operationId: getCaseTableMapping
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: path
        required: true
        schema:
          type: string
          title: Casetableid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnMappingOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/norms:
    get:
      tags:
      - norms
      summary: List Norms
      operationId: listNorms
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NormVersion'
                title: Response Listnorms
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - norms
      summary: Create Norm Version
      description: Body is the library's norm JSON plus a note; a new immutable version is created and validated.
      operationId: createNormVersion
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormVersionCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormVersion'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Content
  /projects/{projectId}/norms/{normVersionId}:
    get:
      tags:
      - norms
      summary: Get Norm Version
      operationId: getNormVersion
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: normVersionId
        in: path
        required: true
        schema:
          type: string
          title: Normversionid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormVersion'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - norms
      summary: Set Norm Status
      operationId: setNormStatus
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: normVersionId
        in: path
        required: true
        schema:
          type: string
          title: Normversionid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormStatusUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormVersion'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/norms/{normVersionId}/check:
    post:
      tags:
      - norms
      summary: Check Norm
      operationId: checkNorm
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: normVersionId
        in: path
        required: true
        schema:
          type: string
          title: Normversionid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormCheckRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormCheck'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/runs:
    get:
      tags:
      - runs
      summary: List Runs
      operationId: listRuns
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Run'
                title: Response Listruns
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - runs
      summary: Create Run
      description: Creates a run and queues its job; identical parameters (or the same Idempotency-Key) return the existing run.
      operationId: createRun
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/runs/{runId}:
    get:
      tags:
      - runs
      summary: Get Run
      operationId: getRun
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          title: Runid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/runs/{runId}/cancel:
    post:
      tags:
      - runs
      summary: Cancel Run
      operationId: cancelRun
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          title: Runid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/runs/{runId}/summary:
    get:
      tags:
      - runs
      summary: Get Run Summary
      operationId: getRunSummary
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          title: Runid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/runs/{runId}/backlog:
    get:
      tags:
      - runs
      summary: Get Backlog
      operationId: getBacklog
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          title: Runid
      - name: slicing
        in: query
        required: true
        schema:
          type: string
          description: slicing id or comma-separated case attributes
          title: Slicing
        description: slicing id or comma-separated case attributes
      - name: view
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: View
      - name: gamma
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Gamma
      - name: minCases
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
          title: Mincases
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: -PI
          title: Sort
      - name: hotspotType
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - severity
            - mechanism
            - reservoir
            type: string
          - type: 'null'
          description: method name of the kind
          title: Hotspottype
        description: method name of the kind
      - name: kind
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - acute
            - systematic
            - widespread
            type: string
          - type: 'null'
          description: kind of problem
          title: Kind
        description: kind of problem
      - name: layer
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: most-missed expectation area (layer id)
          title: Layer
        description: most-missed expectation area (layer id)
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Pagesize
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklogPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/runs/{runId}/slices/{sliceKey}:
    get:
      tags:
      - runs
      summary: Get Slice
      operationId: getSlice
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          title: Runid
      - name: sliceKey
        in: path
        required: true
        schema:
          type: string
          title: Slicekey
      - name: slicing
        in: query
        required: true
        schema:
          type: string
          title: Slicing
      - name: view
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: View
      - name: drilldown
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: case attribute for the penalty-mass Pareto
          title: Drilldown
        description: case attribute for the penalty-mass Pareto
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SliceDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/runs/{runId}/cases/{caseId}/trace:
    get:
      tags:
      - runs
      summary: Get Trace
      operationId: getTrace
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          title: Runid
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          title: Caseid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trace'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/runs/{runId}/diagnostics:
    get:
      tags:
      - runs
      summary: Get Diagnostics
      operationId: getDiagnostics
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          title: Runid
      - name: slicing
        in: query
        required: true
        schema:
          type: string
          title: Slicing
      - name: view
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: View
      responses:
