openapi: 3.1.0
info:
  title: WISE Workbench API
  description: 'WISE Workbench backend: projects, datasets, mappings, case tables, norm versions, runs, backlogs, slice detail, traces, diagnostics, signal distributions, process flow and jobs. Errors are RFC 9457 problem details.'
  version: 0.1.0
paths:
  /system/health:
    get:
      tags:
      - system
      summary: Health
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health
  /system/ready:
    get:
      tags:
      - system
      summary: Ready
      operationId: ready
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ready
  /system/version:
    get:
      tags:
      - system
      summary: Version
      operationId: version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /projects:
    get:
      tags:
      - projects
      summary: List Projects
      operationId: listProjects
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Project'
                type: array
                title: Response Listprojects
    post:
      tags:
      - projects
      summary: Create Project
      operationId: createProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}:
    get:
      tags:
      - projects
      summary: Get Project
      operationId: getProject
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets:
    get:
      tags:
      - datasets
      summary: List Datasets
      operationId: listDatasets
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetVersion'
                title: Response Listdatasets
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - datasets
      summary: Upload Dataset
      description: Multipart upload of CSV, Parquet or XES; returns the ingest job. The dataset id is in resultRef.
      operationId: uploadDataset
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_uploadDataset'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets/presets:
    get:
      tags:
      - datasets
      summary: List Presets
      description: Public logs with a known mapping and norm that can be loaded in one click; `available` says whether the files are on this machine.
      operationId: listPresets
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Preset'
                title: Response Listpresets
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets/presets/{presetId}:
    post:
      tags:
      - datasets
      summary: Load Preset
      description: 'Loads a public log preset: registers the configured file (not copied), builds the case table with the known mapping, imports the norm and scores a run, all in one job. The run id is in resultRef when done; every step reuses what the project already has.'
      operationId: loadPreset
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: presetId
        in: path
        required: true
        schema:
          type: string
          title: Presetid
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Content
  /projects/{projectId}/datasets/{datasetId}:
    get:
      tags:
      - datasets
      summary: Get Dataset
      operationId: getDataset
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          title: Datasetid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersion'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets/{datasetId}/preview:
    get:
      tags:
      - datasets
      summary: Preview Dataset
      operationId: previewDataset
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          title: Datasetid
      - name: rows
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 50
          title: Rows
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets/{datasetId}/mapping-suggestion:
    get:
      tags:
      - datasets
      summary: Suggest Mapping
      description: 'A column mapping guessed from the column names: exact presets for known logs, patterns otherwise.'
      operationId: suggestMapping
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          title: Datasetid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingSuggestion'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets/{datasetId}/mappings:
    get:
      tags:
      - datasets
      summary: List Mappings
      operationId: listMappings
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          title: Datasetid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColumnMappingOut'
                title: Response Listmappings
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - datasets
      summary: Create Mapping
      description: Validates the mapping on a sample and starts the case-table build job. The case table id is in resultRef.
      operationId: createMapping
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          title: Datasetid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnMapping'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Content
  /projects/{projectId}/case-tables:
    get:
      tags:
      - datasets
      summary: List Case Tables
      operationId: listCaseTables
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseTable'
                title: Response Listcasetables
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/case-tables/{caseTableId}:
    get:
      tags:
      - datasets
      summary: Get Case Table
      operationId: getCaseTable
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: path
        required: true
        schema:
          type: string
          title: Casetableid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseTable'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/case-tables/{caseTableId}/mapping:
    get:
      tags:
      - datasets
      summary: Get Case Table Mapping
      operationId: getCaseTableMapping
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: path
        required: true
        schema:
          type: string
          title: Casetableid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnMappingOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/case-tables/{caseTableId}/flow-types:
    get:
      tags:
      - datasets
      summary: Get Flow Types
      description: 'The detected flow types of a case table (from the mapping''s flow typing, else from the named attribute): counts, share, one process map each with stage groups, and a readiness headline per type. Each type carries the run scope that analyses it alone.'
      operationId: getFlowTypes
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: path
        required: true
        schema:
          type: string
          title: Casetableid
      - name: attribute
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'case attribute holding the flow type (default: the mapping''s)'
          title: Attribute
        description: 'case attribute holding the flow type (default: the mapping''s)'
      - name: abstraction
        in: query
        required: false
        schema:
          type: number
          maximum: 1.0
          minimum: 0.0
          default: 0.05
          title: Abstraction
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowTypes'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/decisions/kinds:
    get:
      tags:
      - datasets
      summary: List Decision Kinds
      description: The decisions a reader can take on readiness items, with the parameters each accepts.
      operationId: listDecisionKinds
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DecisionKind'
                title: Response Listdecisionkinds
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/decisions:
    get:
      tags:
      - datasets
      summary: List Decisions
      description: Decisions taken in the project (optionally those that touch one case table).
      operationId: listDecisions
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Casetableid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Decision'
                title: Response Listdecisions
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/case-tables/{caseTableId}/decisions:
    get:
      tags:
      - datasets
      summary: Get Case Table Decisions
      description: 'Every readiness item with its full option set, the decision in force (its option marked) and the decision history, plus the lineage of case tables the decisions built. A decision never removes the options of its item: deciding again creates the next mapping version. A new decision is applied to `caseTableId` here, the head of the lineage, so decisions accumulate.'
      operationId: getCaseTableDecisions
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: path
        required: true
        schema:
          type: string
          title: Casetableid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionItems'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - datasets
      summary: Apply Decision
      description: 'Apply a decision: it is stored as a versioned mapping decision (a child mapping), a new case table is built from it (job) and its readiness report is the re-evaluation.'
      operationId: applyDecision
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: path
        required: true
        schema:
          type: string
          title: Casetableid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionApplied'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/case-tables/{caseTableId}/decisions/preview:
    post:
      tags:
      - datasets
      summary: Preview Decision
      description: Cases and events a decision would affect, before it is applied.
      operationId: previewDecision
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: path
        required: true
        schema:
          type: string
          title: Casetableid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionPreviewOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/norms/{normVersionId}/signals/{constraintId}:
    get:
      tags:
      - norms
      summary: Get Norm Signal Distribution
      description: Preview the selected norm version's rule, derived attributes and applicability on the explicit mapped table. No run is required or created. Native threshold shares use finite observed signals; casesInScope and stats.nCases include applicable cases with missing signals. stats.n counts finite observations.
      operationId: getNormSignalDistribution
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: normVersionId
        in: path
        required: true
        schema:
          type: string
          title: Normversionid
      - name: constraintId
        in: path
        required: true
        schema:
          type: string
          title: Constraintid
      - name: caseTableId
        in: query
        required: true
        schema:
          type: string
          description: the mapped case table to preview
          title: Casetableid
        description: the mapped case table to preview
      - name: scale
        in: query
        required: false
        schema:
          enum:
          - linear
          - log
          type: string
          description: bin scale of the histogram
          default: linear
          title: Scale
        description: bin scale of the histogram
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormSignalDistribution'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Content
  /projects/{projectId}/norms:
    get:
      tags:
      - norms
      summary: List Norms
      operationId: listNorms
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NormVersion'
                title: Response Listnorms
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - norms
      summary: Create Norm Version
      description: Body is the library's norm JSON plus a note; a new immutable version is created and validated.
      operationId: createNormVersion
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormVersionCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormVersion'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Content
  /projects/{projectId}/norms/applicability:
    get:
      tags:
      - norms
      summary: Get Applicability Options
      description: 'What an expectation can be made to apply to on this log (R3-02): the flow types the case table carries with their counts, the flow types the rules name that it does not carry and why, every case attribute with its values, and the shape of each applicability clause including *not applicable to this log*.'
      operationId: getApplicabilityOptions
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: query
        required: true
        schema:
          type: string
          description: the case table the norm is written against
          title: Casetableid
        description: the case table the norm is written against
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicabilityOptions'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Content
  /projects/{projectId}/norms/inventory:
    get:
      tags:
      - norms
      summary: Get Norm Inventory
      description: 'The pickers of the norm builder: the log''s activities with their event and case counts and their stage, and every case attribute with its distinct count and its values. Without `attribute` each attribute is summarised with its ten most frequent values; with one, that attribute''s values are listed (searchable with `q`, up to `limit`).'
      operationId: getNormInventory
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: query
        required: true
        schema:
          type: string
          description: the case table the norm is written against
          title: Casetableid
        description: the case table the norm is written against
      - name: attribute
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: list this attribute's values in full
          title: Attribute
        description: list this attribute's values in full
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: search activities or values
          title: Q
        description: search activities or values
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 25
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Content
  /projects/{projectId}/norms/constraints/check:
    post:
      tags:
      - norms
      summary: Check Constraint
      description: 'One expectation checked against a case table before it goes into a norm: whether it is well formed, whether the activities it names occur, how many cases it applies to and how many miss it, and what it says in one plain sentence with its applicability in words.'
      operationId: checkConstraint
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstraintCheckRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintCheck'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Content
  /projects/{projectId}/norms/guidance-questions:
    get:
      tags:
      - norms
      summary: Get Guidance Questions
      description: 'The five questions asked when an expectation area or an expectation is defined (knowledge-hub panel §4): what we call it, what we expect, what it means when missed, what usually causes it, what we do about it and who owns it. The pack''s text is offered as a starting answer; answers are stored as the project''s guidance overlay.'
      operationId: getGuidanceQuestions
      parameters:
      - name: projectId
        in: path
        required: true
