openapi: 3.1.0
info:
  title: WISE Workbench API
  description: 'WISE Workbench backend: projects, datasets, mappings, case tables, norm versions, runs, backlogs, slice detail, traces, diagnostics, signal distributions, process flow and jobs. Errors are RFC 9457 problem details.'
  version: 0.1.0
paths:
  /system/health:
    get:
      tags:
      - system
      summary: Health
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health
  /system/ready:
    get:
      tags:
      - system
      summary: Ready
      operationId: ready
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ready
  /system/version:
    get:
      tags:
      - system
      summary: Version
      operationId: version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /projects:
    get:
      tags:
      - projects
      summary: List Projects
      operationId: listProjects
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Project'
                type: array
                title: Response Listprojects
    post:
      tags:
      - projects
      summary: Create Project
      operationId: createProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}:
    get:
      tags:
      - projects
      summary: Get Project
      operationId: getProject
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/dataset-binding:
    get:
      tags:
      - projects
      summary: Get Project Dataset Binding
      operationId: getProjectDatasetBinding
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDatasetBinding'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - projects
      summary: Put Project Dataset Binding
      operationId: bindProjectDataset
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectDatasetBindingPut'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDatasetBinding'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/dataset-catalogue:
    get:
      tags:
      - datasets
      summary: Get Dataset Catalogue
      description: Registered datasets across this local workspace and explicitly configured links to other local workspaces. Read-only; no imports, file scanning or server probes.
      operationId: getDatasetCatalogue
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetCatalogue'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/dataset-catalogue/imports/{entryId}:
    post:
      tags:
      - datasets
      summary: Import Catalogue Dataset
      description: Import an explicitly configured local source by catalogue ID. The request cannot supply a file path. Mapping and norm review remain separate steps.
      operationId: importCatalogueDataset
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          title: Entryid
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets:
    get:
      tags:
      - datasets
      summary: List Datasets
      operationId: listDatasets
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetVersion'
                title: Response Listdatasets
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - datasets
      summary: Upload Dataset
      description: Multipart upload of CSV, Parquet or XES; returns the ingest job. The dataset id is in resultRef.
      operationId: uploadDataset
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_uploadDataset'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets/presets:
    get:
      tags:
      - datasets
      summary: List Presets
      description: Public logs with a known mapping and norm that can be loaded in one click; `available` says whether the files are on this machine.
      operationId: listPresets
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Preset'
                title: Response Listpresets
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets/presets/{presetId}:
    post:
      tags:
      - datasets
      summary: Load Preset
      description: 'Loads a public log preset: registers the configured file (not copied), builds the case table with the known mapping, imports the norm and scores a run, all in one job. The run id is in resultRef when done; every step reuses what the project already has.'
      operationId: loadPreset
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: presetId
        in: path
        required: true
        schema:
          type: string
          title: Presetid
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Content
  /projects/{projectId}/datasets/{datasetId}:
    get:
      tags:
      - datasets
      summary: Get Dataset
      operationId: getDataset
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          title: Datasetid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersion'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets/{datasetId}/preview:
    get:
      tags:
      - datasets
      summary: Preview Dataset
      operationId: previewDataset
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          title: Datasetid
      - name: rows
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 50
          title: Rows
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets/{datasetId}/mapping-suggestion:
    get:
      tags:
      - datasets
      summary: Suggest Mapping
      description: 'A column mapping guessed from the column names: exact presets for known logs, patterns otherwise.'
      operationId: suggestMapping
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          title: Datasetid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingSuggestion'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/datasets/{datasetId}/mappings:
    get:
      tags:
      - datasets
      summary: List Mappings
      operationId: listMappings
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          title: Datasetid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColumnMappingOut'
                title: Response Listmappings
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - datasets
      summary: Create Mapping
      description: Validates the mapping on a sample and starts the case-table build job. The case table id is in resultRef.
      operationId: createMapping
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          title: Datasetid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnMapping'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Content
  /projects/{projectId}/case-tables:
    get:
      tags:
      - datasets
      summary: List Case Tables
      operationId: listCaseTables
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseTable'
                title: Response Listcasetables
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/case-tables/{caseTableId}:
    get:
      tags:
      - datasets
      summary: Get Case Table
      operationId: getCaseTable
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: path
        required: true
        schema:
          type: string
          title: Casetableid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseTable'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/case-tables/{caseTableId}/mapping:
    get:
      tags:
      - datasets
      summary: Get Case Table Mapping
      operationId: getCaseTableMapping
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: path
        required: true
        schema:
          type: string
          title: Casetableid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnMappingOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/case-tables/{caseTableId}/flow-types:
    get:
      tags:
      - datasets
      summary: Get Flow Types
      description: 'The detected flow types of a case table (from the mapping''s flow typing, else from the named attribute): counts, share, one process map each with stage groups, and a readiness headline per type. Each type carries the run scope that analyses it alone.'
      operationId: getFlowTypes
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: path
        required: true
        schema:
          type: string
          title: Casetableid
      - name: attribute
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'case attribute holding the flow type (default: the mapping''s)'
          title: Attribute
        description: 'case attribute holding the flow type (default: the mapping''s)'
      - name: abstraction
        in: query
        required: false
        schema:
          type: number
          maximum: 1.0
          minimum: 0.0
          default: 0.05
          title: Abstraction
      - name: selectionId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^sel_[a-z0-9]{17,24}$
          - type: 'null'
          description: saved EDA cohort used for these flow counts and maps
          title: Selectionid
        description: saved EDA cohort used for these flow counts and maps
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowTypes'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/decisions/kinds:
    get:
      tags:
      - datasets
      summary: List Decision Kinds
      description: The decisions a reader can take on readiness items, with the parameters each accepts.
      operationId: listDecisionKinds
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DecisionKind'
                title: Response Listdecisionkinds
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/decisions:
    get:
      tags:
      - datasets
      summary: List Decisions
      description: Decisions taken in the project (optionally those that touch one case table).
      operationId: listDecisions
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Casetableid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Decision'
                title: Response Listdecisions
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/case-tables/{caseTableId}/decisions:
    get:
      tags:
      - datasets
      summary: Get Case Table Decisions
      description: 'Every readiness item with its full option set, the decision in force (its option marked) and the decision history, plus the lineage of case tables the decisions built. A decision never removes the options of its item: deciding again creates the next mapping version. A new decision is applied to `caseTableId` here, the head of the lineage, so decisions accumulate.'
      operationId: getCaseTableDecisions
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: path
        required: true
        schema:
          type: string
          title: Casetableid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionItems'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - datasets
      summary: Apply Decision
      description: 'Apply a decision: it is stored as a versioned mapping decision (a child mapping), a new case table is built from it (job) and its readiness report is the re-evaluation.'
      operationId: applyDecision
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: path
        required: true
        schema:
          type: string
          title: Casetableid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionApplied'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/case-tables/{caseTableId}/decisions/preview:
    post:
      tags:
      - datasets
      summary: Preview Decision
      description: Cases and events a decision would affect, before it is applied.
      operationId: previewDecision
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: path
        required: true
        schema:
          type: string
          title: Casetableid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionPreviewOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{projectId}/case-tables/{caseTableId}/eda:
    get:
      tags:
      - data exploration
      summary: Get Case Table Eda
      description: Read-only linked case-table overview before norm selection. All views share one selection; only bounded aggregates and up to 100 case rows are returned. The selection JSON accepts categoryKeys, timeRanges with exclusive before bounds, spanRanges with exclusive max bounds, and timeMissing/spanMissing union flags. OR within dimensions, AND across dimensions and legacy parameters. Legacy time filter to bounds remain inclusive. Event/norm clauses are rejected.
      operationId: getCaseTableEDA
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Projectid
      - name: caseTableId
        in: path
        required: true
        schema:
          type: string
          title: Casetableid
      - name: datasetId
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
          title: Datasetid
      - name: attribute
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
          title: Attribute
      - name: insight
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Insight
      - name: compareAttribute
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 256
          - type: 'null'
          title: Compareattribute
      - name: hierarchyFields
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              minLength: 1
              maxLength: 256
            minItems: 3
            maxItems: 3
          - type: 'null'
          title: Hierarchyfields
      - name: valueField
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 256
          - type: 'null'
          title: Valuefield
      - name: valueSearch
        in: query
        required: false
        schema:
          type: string
          maxLength: 256
          default: ''
          title: Valuesearch
      - name: valuePage
        in: query
        required: false
        schema:
          type: integer
          maximum: 100000
          minimum: 1
          default: 1
          title: Valuepage
      - name: eventInsight
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Eventinsight
      - name: activitySearch
        in: query
        required: false
        schema:
          type: string
          maxLength: 256
          default: ''
          title: Activitysearch
      - name: activityPage
        in: query
        required: false
        schema:
          type: integer
          maximum: 100000
          minimum: 1
          default: 1
          title: Activitypage
      - name: endpointStart
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 4096
          - type: 'null'
          title: Endpointstart
      - name: endpointEnd
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 4096
          - type: 'null'
          title: Endpointend
      - name: traceCaseId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 4096
          - type: 'null'
          title: Tracecaseid
      - name: tracePage
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000000
          minimum: 1
          default: 1
          title: Tracepage
      - name: filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 8192
          - type: 'null'
          title: Filter
      - name: selection
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 131072
          - type: 'null'
          description: 'JSON object: facets ({field,keys}, up to 16 unique fields), eventRanges ({min,max}, nonnegative event counts, exclusive upper bound), eventMissing (union with eventRanges), categoryKeys (returned keys), timeRanges ({from,before}, exclusive upper bound), timeMissing, spanRanges ({min,max}, exclusive upper bound), spanMissing. OR within dimensions, AND across dimensions and legacy parameters. Empty arrays and unsupported fields are rejected.'
          title: Selection
